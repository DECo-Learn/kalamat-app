<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#39B8C8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Kalamat</title>
<link rel="manifest" href="manifest.json?v=6">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=6">
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:#EFFBFC}
body{margin:0;background:#EFFBFC;color:#20383c;font-family:Tahoma,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input{font:inherit} button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
.shell{max-width:760px;margin:0 auto;min-height:100vh}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#39B8C8,#2A9EAE);color:#fff;padding:12px 14px 14px;box-shadow:0 4px 18px rgba(32,80,86,.16)}
.brandrow{display:flex;align-items:center;gap:10px}
.logo{width:44px;height:44px;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 7px 18px rgba(57,184,200,.22);flex:0 0 auto;border:1px solid #CFECEF}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.brand{min-width:0;flex:1}
.brand h1{font-size:19px;margin:0} .brand p{margin:3px 0 0;font-size:11px;opacity:.9}
.authmini{border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.14);color:#fff;border-radius:11px;padding:8px 10px;font-size:12px}
.searchwrap{position:relative;margin-top:10px}
.search{width:100%;height:46px;border:0;border-radius:14px;padding:0 14px;background:#fff;color:#20383c;font-size:16px;outline:none}
.clear{position:absolute;left:5px;top:5px;width:36px;height:36px;border:0;border-radius:10px;background:#E5F8FA;color:#355A60;display:none}
.clear.show{display:block}
.catswrap{position:sticky;top:112px;z-index:15;background:#EFFBFC;padding:9px 10px 11px;border-bottom:1px solid #CFECEF}
.cats{display:flex;gap:7px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none} .cats::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid #CFECEF;background:#fff;color:#355A60;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:700}
.chip.on{background:#39B8C8;color:#fff;border-color:#39B8C8}
.main{padding:12px 12px 90px}
.meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:1px 2px 10px}
.meta h2{font-size:18px;margin:0} .count{font-size:12px;color:#607B80}
.cards{display:grid;gap:9px}
.card{background:#fff;border:1px solid #CFECEF;border-radius:16px;padding:13px;display:flex;direction:ltr;gap:10px;align-items:flex-start;box-shadow:0 5px 18px rgba(32,80,86,.05)}
.phrase{flex:1;min-width:0} .en{text-align:left;direction:ltr;font-weight:800;font-size:16px;line-height:1.55;color:#173653;overflow-wrap:anywhere}
.fa{direction:rtl;text-align:right;margin-top:7px;padding-top:7px;border-top:1px dashed #CFECEF;font-size:14px;line-height:1.75;color:#355A60}
.actions{display:flex;flex-direction:column;gap:7px;flex:0 0 auto}
.actions button{border:0;border-radius:12px;width:43px;height:40px;display:flex;align-items:center;justify-content:center;font-size:17px}
.play{background:#39B8C8;color:#fff} .play.playing{background:#2e755c}
.fav,.copy{background:#E5F8FA;color:#557075} .fav.on{background:#fff0f5;color:#b4426d}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,760px);z-index:30;background:#fff;border-top:1px solid #CFECEF;padding:7px 10px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.bottom button{min-height:48px;border:0;border-radius:13px;background:transparent;color:#607A7F;font-size:12px;font-weight:700} .bottom button.on{background:#E5F8FA;color:#2A9EAE}
.state{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;background:linear-gradient(180deg,#EFFBFC,#fff)}
.box{width:min(100%,430px);background:#fff;border:1px solid #CFECEF;border-radius:24px;padding:22px;box-shadow:0 18px 55px rgba(32,80,86,.11);text-align:center}
.biglogo{width:92px;height:92px;border-radius:24px;overflow:hidden;margin:0 auto 14px;box-shadow:0 12px 30px rgba(57,184,200,.2)} .biglogo img{width:100%;height:100%;object-fit:cover}
.box h1{font-size:24px;margin:4px 0 6px} .box p{color:#607B80;line-height:1.9;font-size:14px}
.field{text-align:right;margin-top:12px} .field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}
.field input{width:100%;height:46px;border:1px solid #CFECEF;border-radius:13px;padding:0 12px;outline:none;font-size:16px}
.primary{width:100%;height:48px;border:0;border-radius:14px;background:#39B8C8;color:#fff;font-weight:800;margin-top:14px}
.secondary{width:100%;height:46px;border:1px solid #CFECEF;border-radius:14px;background:#fff;color:#2A9EAE;font-weight:800;margin-top:10px}
.err{margin-top:10px;background:#fff0f0;border:1px solid #f2caca;color:#9a3535;border-radius:12px;padding:9px 10px;font-size:12px;line-height:1.7}
.lockicon{font-size:38px;margin-bottom:4px}
.loader{width:34px;height:34px;border:4px solid #CFECEF;border-top-color:#39B8C8;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px} @keyframes spin{to{transform:rotate(360deg)}}
.empty{background:#fff;border:1px dashed #CFECEF;border-radius:16px;padding:28px 18px;text-align:center;color:#607B80}
.toast{position:fixed;z-index:80;left:50%;bottom:88px;transform:translateX(-50%);background:#20383c;color:#fff;border-radius:12px;padding:9px 13px;font-size:12px;display:none;max-width:calc(100% - 28px);text-align:center}
.toast.show{display:block}
.colloc-card .phrase-main{font-weight:900;font-size:17px;color:#173653;text-align:left;direction:ltr;line-height:1.5}
.colloc-card .meaning{margin-top:5px;text-align:right;direction:rtl;color:#355A60;font-size:14px;font-weight:700}
.colloc-card .example{margin-top:9px;padding-top:9px;border-top:1px dashed #CFECEF;text-align:left;direction:ltr;color:#294f56;font-size:13px;line-height:1.65}
.colloc-card .example-fa{margin-top:4px;text-align:right;direction:rtl;color:#607B80;font-size:12px;line-height:1.7}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;direction:ltr}.badge{background:#E5F8FA;color:#2A9EAE;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:800}
@media(min-width:640px){.cards{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<section id="loadingState" class="state">
  <div class="box">
    <div class="loader"></div>
    <h1>Kalamat</h1>
    <p>در حال بررسی حساب شما…</p>
  </div>
</section>

<section id="loginState" class="state hidden">
  <div class="box">
    <div class="biglogo"><img src="icon-512.png?v=6" alt=""></div>
    <h1>ورود به Kalamat</h1>
    <p>برای مشاهده Daily Conversations با حساب فعال خود وارد شوید.</p>
    <form id="loginForm">
      <div class="field"><label>ایمیل</label><input id="email" type="email" autocomplete="email" required></div>
      <div class="field"><label>رمز عبور</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="primary" type="submit">ورود</button>
    </form>
    <div id="loginError" class="err hidden"></div>
  </div>
</section>

<section id="lockedState" class="state hidden">
  <div class="box">
    <div class="biglogo"><img src="icon-512.png?v=6" alt=""></div>
    <div class="lockicon">🔒</div>
    <h1>دسترسی شما فعال نیست</h1>
    <p>این حساب وجود دارد، اما دسترسی Daily Conversations برای آن هنوز فعال نشده است.</p>
    <button id="lockedLogout" class="secondary">خروج از حساب</button>
  </div>
</section>

<div id="appState" class="shell hidden">
  <header class="top">
    <div class="brandrow">
      <div class="logo"><img src="icon-192.png?v=6" alt=""></div>
      <div class="brand"><h1>مکالمات روزمره</h1><p>Daily Conversations</p></div>
      <button id="logout" class="authmini">خروج</button>
    </div>
    <div class="searchwrap">
      <input id="search" class="search" type="search" placeholder="جست‌وجو: breakfast یا صبحانه" autocomplete="off">
      <button id="clear" class="clear" type="button">×</button>
    </div>
  </header>
  <div class="catswrap"><div id="cats" class="cats"></div></div>
  <main class="main">
    <div class="meta"><h2 id="title">همه جمله‌ها</h2><div id="count" class="count"></div></div>
    <div id="cards" class="cards"></div>
    <div id="empty" class="empty hidden">جمله‌ای پیدا نشد.</div>
  </main>
  <nav class="bottom">
    <button id="dailyTab" class="on">Daily</button>
    <button id="collocTab">Collocations</button>
    <button id="favTab">علاقه‌مندی‌ها</button>
  </nav>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  const SUPABASE_URL = "https://bytarviuxlhwjorvwcpy.supabase.co";
  const SUPABASE_KEY = "sb_publishable_FXiin8igNp5Lzhs4uHeJHg_mrnYHBCE";
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const loadingState = document.getElementById('loadingState');
  const loginState = document.getElementById('loginState');
  const lockedState = document.getElementById('lockedState');
  const appState = document.getElementById('appState');
  const loginError = document.getElementById('loginError');
  const loginForm = document.getElementById('loginForm');
  const search = document.getElementById('search');
  const clear = document.getElementById('clear');
  const cats = document.getElementById('cats');
  const cards = document.getElementById('cards');
  const count = document.getElementById('count');
  const title = document.getElementById('title');
  const empty = document.getElementById('empty');
  const dailyTab = document.getElementById('dailyTab');
  const collocTab = document.getElementById('collocTab');
  const favTab = document.getElementById('favTab');

  let categories = [];
  let sentences = [];
  let collocCategories = [];
  let collocations = [];
  let module = 'daily';
  let cat = 'all';
  let mode = 'all';
  let currentUtterance = null;
  let favs = {};
  try { favs = JSON.parse(localStorage.getItem('kalamat.favs') || '{}') || {}; } catch(e) {}

  function showOnly(el) {
    [loadingState,loginState,lockedState,appState].forEach(x=>x.classList.add('hidden'));
    el.classList.remove('hidden');
  }
  function toast(t) {
    const x=document.getElementById('toast'); x.textContent=t; x.classList.add('show');
    clearTimeout(window.__t); window.__t=setTimeout(()=>x.classList.remove('show'),1500);
  }
  function norm(s) {
    return String(s||'').toLowerCase().normalize ? String(s||'').toLowerCase().normalize('NFKC').replace(/ي/g,'ی').replace(/ك/g,'ک') : String(s||'').toLowerCase();
  }
  async function checkAccessAndLoad() {
    showOnly(loadingState);
    const { data: { session } } = await db.auth.getSession();
    if (!session) { showOnly(loginState); return; }

    const { data: access, error: accessError } = await db
      .from('user_access')
      .select('active,plan,expires_at')
      .eq('user_id', session.user.id)
      .maybeSingle();

    if (accessError) {
      console.error(accessError);
      showOnly(lockedState);
      return;
    }
    const active = access && access.active === true && (!access.expires_at || new Date(access.expires_at) > new Date());
    if (!active) { showOnly(lockedState); return; }

    const [catRes, sentRes, ccatRes, collRes] = await Promise.all([
      db.from('categories').select('id,slug,title_fa,title_en,sort_order').order('sort_order'),
      db.from('sentences').select('id,category_id,english,persian,sort_order').order('category_id').order('sort_order'),
      db.from('collocation_categories').select('id,slug,title_fa,title_en,sort_order').order('sort_order'),
      db.from('collocations').select('id,category_id,phrase,meaning_fa,example_en,example_fa,level,pattern,sort_order').order('category_id').order('sort_order')
    ]);
    if (catRes.error || sentRes.error || ccatRes.error || collRes.error) {
      console.error(catRes.error || sentRes.error || ccatRes.error || collRes.error);
      lockedState.querySelector('p').textContent='خطایی در دریافت محتوا رخ داد. لطفاً دوباره تلاش کنید.';
      showOnly(lockedState); return;
    }
    categories = catRes.data || [];
    sentences = sentRes.data || [];
    collocCategories = ccatRes.data || [];
    collocations = collRes.data || [];
    buildCats();
    render();
    showOnly(appState);
  }

  loginForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    loginError.classList.add('hidden');
    const email=document.getElementById('email').value.trim();
    const password=document.getElementById('password').value;
    const btn=loginForm.querySelector('button');
    btn.disabled=true; btn.textContent='در حال ورود…';
    const { error } = await db.auth.signInWithPassword({email,password});
    btn.disabled=false; btn.textContent='ورود';
    if(error) {
      loginError.textContent = 'ورود ناموفق بود. ایمیل یا رمز عبور را بررسی کنید.';
      loginError.classList.remove('hidden'); return;
    }
    await checkAccessAndLoad();
  });

  async function logout() {
    try { speechSynthesis.cancel(); } catch(e) {}
    await db.auth.signOut();
    search.value='';
    categories=[]; sentences=[]; collocCategories=[]; collocations=[];
    showOnly(loginState);
  }
  document.getElementById('logout').addEventListener('click', logout);
  document.getElementById('lockedLogout').addEventListener('click', logout);

  function buildCats() {
    cats.innerHTML='';
    const all=document.createElement('button');
    all.className='chip on'; all.dataset.cat='all'; all.textContent='همه';
    cats.appendChild(all);
    const source = module==='daily' ? categories : collocCategories;
    source.forEach(c=>{
      const b=document.createElement('button');
      b.className='chip'; b.dataset.cat=String(c.id); b.textContent=c.title_fa || c.title_en || 'دسته';
      cats.appendChild(b);
    });
  }
  cats.addEventListener('click',(e)=>{
    const b=e.target.closest('.chip'); if(!b)return;
    mode='all'; cat=b.dataset.cat;
    [...cats.querySelectorAll('.chip')].forEach(x=>x.classList.remove('on')); b.classList.add('on');
    favTab.classList.remove('on'); render();
  });
  dailyTab.addEventListener('click',()=>{module='daily';mode='all';cat='all';search.value='';dailyTab.classList.add('on');collocTab.classList.remove('on');favTab.classList.remove('on');buildCats();render();});
  collocTab.addEventListener('click',()=>{module='colloc';mode='all';cat='all';search.value='';collocTab.classList.add('on');dailyTab.classList.remove('on');favTab.classList.remove('on');buildCats();render();});
  favTab.addEventListener('click',()=>{mode='fav';favTab.classList.add('on');dailyTab.classList.remove('on');collocTab.classList.remove('on');render();});
  search.addEventListener('input',render);
  clear.addEventListener('click',()=>{search.value='';render();search.focus();});

  function render() {
    const q=norm(search.value);
    clear.classList.toggle('show', !!search.value);
    cards.innerHTML='';
    let list=[];
    if(module==='daily'){
      list=sentences.filter(s=>{
        if(mode==='fav' && !favs['d-'+s.id]) return false;
        if(mode==='all' && cat!=='all' && String(s.category_id)!==String(cat)) return false;
        if(q && !norm(s.english+' '+s.persian).includes(q)) return false;
        return true;
      });
      list.forEach(s=>{
        const a=document.createElement('article'); a.className='card';
        const p=document.createElement('div'); p.className='phrase';
        const en=document.createElement('div'); en.className='en'; en.textContent=s.english;
        const fa=document.createElement('div'); fa.className='fa'; fa.textContent=s.persian;
        p.append(en,fa);
        const acts=document.createElement('div'); acts.className='actions';
        const play=document.createElement('button'); play.className='play'; play.textContent='▶'; play.onclick=()=>speak(s.english,play);
        const fav=document.createElement('button'); const key='d-'+s.id; fav.className='fav'+(favs[key]?' on':''); fav.textContent=favs[key]?'♥':'♡';
        fav.onclick=()=>{if(favs[key]) delete favs[key]; else favs[key]=1;localStorage.setItem('kalamat.favs',JSON.stringify(favs));render();};
        const cp=document.createElement('button'); cp.className='copy'; cp.textContent='⧉'; cp.onclick=()=>copyText(s.english+'\n'+s.persian);
        acts.append(play,fav,cp); a.append(p,acts); cards.appendChild(a);
      });
    } else {
      list=collocations.filter(c=>{
        if(mode==='fav' && !favs['c-'+c.id]) return false;
        if(mode==='all' && cat!=='all' && String(c.category_id)!==String(cat)) return false;
        if(q && !norm(c.phrase+' '+c.meaning_fa+' '+c.example_en+' '+c.example_fa).includes(q)) return false;
        return true;
      });
      list.forEach(c=>{
        const a=document.createElement('article'); a.className='card colloc-card';
        const p=document.createElement('div'); p.className='phrase';
        const ph=document.createElement('div'); ph.className='phrase-main'; ph.textContent=c.phrase;
        const me=document.createElement('div'); me.className='meaning'; me.textContent=c.meaning_fa;
        const ex=document.createElement('div'); ex.className='example'; ex.textContent=c.example_en;
        const exfa=document.createElement('div'); exfa.className='example-fa'; exfa.textContent=c.example_fa;
        const badges=document.createElement('div'); badges.className='badges';
        if(c.level){const b=document.createElement('span');b.className='badge';b.textContent=c.level;badges.appendChild(b)}
        if(c.pattern){const b=document.createElement('span');b.className='badge';b.textContent=c.pattern;badges.appendChild(b)}
        p.append(ph,me,ex,exfa,badges);
        const acts=document.createElement('div'); acts.className='actions';
        const play=document.createElement('button'); play.className='play'; play.textContent='▶'; play.onclick=()=>speak(c.phrase,play);
        const fav=document.createElement('button'); const key='c-'+c.id; fav.className='fav'+(favs[key]?' on':''); fav.textContent=favs[key]?'♥':'♡';
        fav.onclick=()=>{if(favs[key]) delete favs[key]; else favs[key]=1;localStorage.setItem('kalamat.favs',JSON.stringify(favs));render();};
        const cp=document.createElement('button'); cp.className='copy'; cp.textContent='⧉'; cp.onclick=()=>copyText(c.phrase+' — '+c.meaning_fa+'\n'+c.example_en+'\n'+c.example_fa);
        acts.append(play,fav,cp); a.append(p,acts); cards.appendChild(a);
      });
    }
    count.textContent=list.length+(module==='daily'?' جمله':' کالوکیشن');
    empty.classList.toggle('hidden', list.length>0);
    if(mode==='fav') title.textContent=module==='daily'?'علاقه‌مندی‌های مکالمه':'علاقه‌مندی‌های کالوکیشن';
    else if(search.value) title.textContent='نتایج جست‌وجو';
    else if(cat==='all') title.textContent=module==='daily'?'همه جمله‌ها':'همه کالوکیشن‌ها';
    else {
      const source=module==='daily'?categories:collocCategories;
      const c=source.find(x=>String(x.id)===String(cat));
      title.textContent=c ? (c.title_fa||c.title_en) : 'موارد';
    }
  }
  async function copyText(text){
    try{await navigator.clipboard.writeText(text);toast('کپی شد');}catch(e){toast('کپی انجام نشد');}
  }
  function speak(text,btn) {
    if(!('speechSynthesis' in window)){toast('پخش صدا در این مرورگر فعال نیست');return;}
    try{speechSynthesis.cancel();}catch(e){}
    const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=.9; u.pitch=1;
    btn.classList.add('playing'); btn.textContent='■';
    u.onend=u.onerror=()=>{btn.classList.remove('playing');btn.textContent='▶';};
    currentUtterance=u; speechSynthesis.speak(u);
  }

  db.auth.onAuthStateChange((event)=>{ if(event==='SIGNED_OUT') showOnly(loginState); });
  checkAccessAndLoad();

  if('serviceWorker' in navigator) {
    window.addEventListener('load',()=>navigator.serviceWorker.register('service-worker.js?v=6'));
  }
})();
</script>
</body>
</html>
