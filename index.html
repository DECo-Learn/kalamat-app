<title>مکالمات روزمره | انگلیسی والدین و کودک</title>
<style>
:root{
  --bg:#f6f4fb;--surface:#ffffff;--surface-2:#f0edfb;--text:#201c2f;--muted:#716b83;
  --primary:#5b4aa8;--primary-2:#7665c7;--accent:#2f7d64;--border:#e5e0f0;--danger:#b34f5e;
  --shadow:0 10px 28px rgba(55,43,95,.08);--radius:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",Arial,sans-serif;min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}
.app-shell{width:min(100%,760px);margin:0 auto;min-height:100vh;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:40;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;background:rgba(246,244,251,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(229,224,240,.88)}
.brand-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,var(--primary),#8876dc);display:grid;place-items:center;color:#fff;font-weight:900;font-size:20px;box-shadow:0 7px 18px rgba(91,74,168,.25);flex:0 0 auto}
.brand{min-width:0;flex:1}.brand h1{margin:0;font-size:18px;line-height:1.35}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}
.icon-btn{width:44px;height:44px;border:1px solid var(--border);background:var(--surface);border-radius:14px;display:grid;place-items:center;color:var(--primary);box-shadow:0 4px 14px rgba(42,32,78,.05)}
.icon-btn svg,.play-btn svg,.mini-btn svg{width:21px;height:21px;display:block}
.search-wrap{position:relative}.search-wrap svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:#8f88a4;pointer-events:none}
.search{width:100%;height:48px;border:1px solid var(--border);background:var(--surface);border-radius:15px;padding:0 46px 0 42px;color:var(--text);font-size:15px;outline:none;box-shadow:0 5px 18px rgba(49,39,88,.04)}
.search:focus{border-color:#a99ee0;box-shadow:0 0 0 4px rgba(91,74,168,.10)}
.clear-search{display:none;position:absolute;left:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;width:36px;height:36px;border-radius:12px;color:#827a98;font-size:22px}.clear-search.show{display:block}
.category-strip{position:sticky;top:126px;z-index:30;background:linear-gradient(to bottom,rgba(246,244,251,.98) 78%,rgba(246,244,251,0));padding:10px 12px 14px;overflow:hidden}
.categories{display:flex;gap:8px;overflow:auto;padding:1px 1px 4px;scrollbar-width:none;overscroll-behavior-x:contain}.categories::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--border);background:var(--surface);color:#514a63;border-radius:999px;min-height:38px;padding:7px 13px;font-size:13px;font-weight:700;box-shadow:0 3px 12px rgba(42,32,78,.04)}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 7px 17px rgba(91,74,168,.22)}
.chip .count{font-size:11px;opacity:.75;margin-right:4px}
.content{padding:0 12px 24px}
.section-meta{display:flex;align-items:end;justify-content:space-between;gap:10px;padding:4px 2px 10px}.section-meta h2{font-size:18px;margin:0}.result-count{color:var(--muted);font-size:12px;white-space:nowrap}
.cards{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);transition:.18s ease;scroll-margin-top:180px}
.card.speaking{border-color:#9bc9b8;box-shadow:0 0 0 3px rgba(47,125,100,.10),var(--shadow)}
.card-main{display:flex;gap:12px;align-items:flex-start;direction:ltr}.phrase{min-width:0;flex:1;text-align:left;direction:ltr}.en{font-size:17px;line-height:1.55;font-weight:800;color:#173653;overflow-wrap:anywhere}.fa{margin-top:7px;padding-top:8px;border-top:1px dashed #ece8f3;direction:rtl;text-align:right;color:#4c465a;font-size:14px;line-height:1.75}
.card-actions{display:flex;flex-direction:column;gap:7px;flex:0 0 auto}.play-btn,.mini-btn{border:0;border-radius:14px;display:grid;place-items:center;transition:.15s ease}.play-btn{width:50px;height:50px;background:var(--primary);color:#fff;box-shadow:0 7px 17px rgba(91,74,168,.2)}.play-btn:active{transform:scale(.96)}.play-btn.on{background:var(--accent)}
.mini-btn{width:42px;height:38px;background:var(--surface-2);color:#655d77}.mini-btn.fav.on{color:#b34f75;background:#fff0f6}.mini-btn.copied{color:var(--accent);background:#eaf7f2}
.empty{background:var(--surface);border:1px dashed #cbc3df;border-radius:var(--radius);padding:32px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);margin-bottom:6px}
.toast{position:fixed;z-index:80;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#252033;color:#fff;padding:10px 14px;border-radius:13px;opacity:0;pointer-events:none;transition:.2s ease;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.18);max-width:calc(100% - 36px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
.bottom-nav{position:fixed;z-index:50;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,760px);padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);backdrop-filter:blur(15px);border-top:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.nav-btn{border:0;background:transparent;color:#746d86;border-radius:14px;min-height:50px;display:flex;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:12px}.nav-btn.on{background:var(--surface-2);color:var(--primary)}.nav-btn svg{width:20px;height:20px}
.sheet-backdrop{position:fixed;inset:0;background:rgba(23,19,35,.32);z-index:89;opacity:0;pointer-events:none;transition:.2s}.sheet-backdrop.show{opacity:1;pointer-events:auto}.sheet{position:fixed;z-index:90;left:50%;bottom:0;width:min(100%,760px);transform:translate(-50%,105%);background:var(--surface);border-radius:26px 26px 0 0;padding:12px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -20px 50px rgba(28,21,51,.18);transition:.25s ease}.sheet.show{transform:translate(-50%,0)}.handle{width:44px;height:5px;border-radius:999px;background:#ded8e8;margin:0 auto 14px}.sheet h3{margin:0 0 14px;font-size:17px}.setting{padding:13px 0;border-top:1px solid #f0edf5}.setting:first-of-type{border-top:0}.setting label{display:block;font-weight:700;font-size:13px;margin-bottom:8px}.select{width:100%;height:44px;border:1px solid var(--border);border-radius:13px;padding:0 10px;background:#fff;color:var(--text)}.rate-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.rate-row input{width:100%;accent-color:var(--primary)}.rate-value{min-width:52px;text-align:center;background:var(--surface-2);border-radius:10px;padding:6px 8px;font-size:12px;font-weight:800}.secondary-btn{width:100%;height:44px;border:1px solid var(--border);background:var(--surface-2);color:var(--primary);border-radius:13px;font-weight:800}.note{font-size:11px;color:var(--muted);line-height:1.7;margin:8px 0 0}
.install-card{display:none;margin:0 0 10px;background:linear-gradient(135deg,#5b4aa8,#7868c6);color:#fff;border-radius:18px;padding:13px 14px;align-items:center;gap:12px}.install-card.show{display:flex}.install-card div{flex:1}.install-card strong{display:block;font-size:14px}.install-card span{display:block;font-size:11px;opacity:.85;margin-top:3px}.install-card button{border:0;background:#fff;color:var(--primary);border-radius:11px;padding:9px 12px;font-weight:900}
@media (min-width:640px){.cards{grid-template-columns:1fr 1fr}.card{min-height:152px}.category-strip{top:126px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<header class="topbar">

    <div class="brand"><h1>مکالمات روزمره</h1><p id="subtitle">انگلیسی کاربردی والدین و کودک</p></div>
    <button class="icon-btn" id="settingsTop" type="button" aria-label="تنظیمات صدا" title="تنظیمات صدا">

  <div class="search-wrap">

</header>
<section class="category-strip" aria-label="دسته‌بندی‌ها"><div class="categories" id="categories"></div></section>
<main class="content">
  <div class="install-card" id="installCard"><div><strong>نصب روی گوشی</strong><span>نسخه وب را مثل یک اپ روی صفحه اصلی نصب کن.</span></div><button id="installBtn" type="button">نصب</button></div>
  <div class="section-meta"><h2 id="sectionTitle">همه جمله‌ها</h2><div class="result-count" id="resultCount"></div></div>
  <div class="cards" id="cards"></div>

</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<nav class="bottom-nav" aria-label="ناوبری اصلی">
  <button class="nav-btn on" id="navHome" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>جمله‌ها</span></button>
  <button class="nav-btn" id="navFav" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg><span>علاقه‌مندی‌ها</span></button>
  <button class="nav-btn" id="navSettings" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21v-7m0-4V3m8 18v-9m0-4V3m8 18v-5m0-4V3"/><path d="M1 14h6M9 8h6m2 8h6"/></svg><span>تنظیمات صدا</span></button>
</nav>
<div class="sheet-backdrop" id="backdrop"></div>
<section class="sheet" id="settingsSheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
  <div class="handle"></div><h3 id="settingsTitle">تنظیمات صدا</h3>
  <div class="setting"><label for="voiceSelect">صدای انگلیسی</label><select class="select" id="voiceSelect"></select><p class="note">فهرست صداها به گوشی و مرورگر شما بستگی دارد. برای کیفیت ثابت تجاری، بهتر است بعداً فایل صوتی ضبط‌شده اضافه شود.</p></div>

</section>
<script>
const DATA = [{t:"بیدار شدن",p:[["It's time to get up.","وقت بیدار شدن است."],["Get up soon.","زود بیدار شو."],["Wake up, sleepyhead.","بیدار شو، خوابالو."],["Rise and shine!","بیدار شو، روزت بخیر!"],["Get up! Or you will be late.","بلند شو! وگرنه دیرت می‌شود."],["It's already late.","دیگر دیر شده."],["I don't want to get up.","نمی‌خواهم بلند شوم."],["Ten more minutes, mom.","مامان، ده دقیقه دیگر."],["It's still early.","هنوز زود است."],["I'm still sleepy.","هنوز خوابم می‌آید."],["Did the alarm go off?","زنگ ساعت خورد؟"],["What time is it now?","الان ساعت چند است؟"],["It's already 8 o'clock.","ساعت هشت شده."],["Oh no. I've overslept.","وای، خوابم برد."],["I'm going to be late.","دیر می‌رسم."],["Did you sleep well?","خوب خوابیدی؟"],["Yes, I slept very well.","بله، خیلی خوب خوابیدم."],["No, I couldn't fall asleep.","نه، خوابم نبرد."],["Did you have a dream?","خواب دیدی؟"],["I had a nightmare.","کابوس دیدم."],["You shouldn't stay up so late.","نباید تا این حد دیر بیدار بمانی."],["Brush your teeth.","دندانت را مسواک بزن."],["Comb your hair.","موهایت را شانه کن."]]},{t:"لباس پوشیدن",p:[["It's time to get dressed.","وقت لباس پوشیدن است."],["Hurry up and get dressed.","زود لباس بپوش."],["What do you want to wear today?","امروز می‌خواهی چه بپوشی؟"],["What should I wear?","چی بپوشم؟"],["How about this shirt?","این پیراهن چطور است؟"],["It looks great on you.","بهت خیلی می‌آید."],["This shirt doesn't go with those pants.","این پیراهن با آن شلوار نمی‌آید."],["Is this shirt too tight?","این پیراهن خیلی تنگ است؟"],["You can't go out without shoes.","بدون کفش بیرون نرو."],["It's cold today. Put on more clothes.","امروز سرد است. لباس بیشتری بپوش."],["Don't forget your jacket.","کتت را فراموش نکن."],["Wrap a scarf around your neck.","شال دور گردنت بپیچ."],["Put your arm through the sleeve.","دستت را توی آستین بکن."],["Button your shirt.","دکمه‌های پیراهنت را ببند."],["Zip up your jacket.","زیپ کت را بکش."],["Put on your shoes.","کفشت را بپوش."],["Tie your shoelaces.","بند کفشت را ببند."],["Your shoes are on the wrong feet.","کفش‌ها را جابه‌جا پوشیده‌ای."],["Your sweater is inside out.","پلیورت پشت‌ورو است."],["You can dress yourself.","خودت می‌توانی لباس بپوشی."]]},{t:"حمّام",p:[["Time for a bath.","وقت حمّام است."],["You are dirty!","کثیف شده‌ای!"],["Go and shower.","برو دوش بگیر."],["You need to have a bath.","باید حمّام کنی."],["The bath is ready.","حمّام آماده است."],["Mommy is scrubbing the bathtub.","مامان دارد وان را می‌شوید."],["Let's prepare the things we need for the bath.","چیزهای لازم برای حمّام را آماده کنیم."],["Washcloth, towels, bathtub, clean clothes.","لیف، حوله، وان، لباس تمیز."],["Which toys would you like to play with?","با کدام اسباب‌بازی می‌خواهی بازی کنی؟"],["You can pick a couple of toys and throw them into the bathtub.","چند تا اسباب‌بازی بردار و توی وان بینداز."],["Stay in bed and undress yourself.","روی تخت بمان و لباست را دربیاور."],["I am preparing water for you.","دارم برایت آب آماده می‌کنم."],["Let me check the water temperature.","بگذار دمای آب را چک کنم."],["It feels just right!","دمایش عالی است!"],["Okay, you can get into the bath now.","باشه، حالا می‌توانی بروی داخل."],["Be careful. The floor is slippery.","مواظب باش. کف زمین لیز است."],["Mom, there isn't any hot water.","مامان، آب گرم نیست."],["Turn on the shower.","دوش را باز کن."],["It's getting cold.","دارد سرد می‌شود."],["Okay, I'll check the heater.","باشه، آبگرمکن را چک می‌کنم."],["Do you feel cozy in the warm water?","توی آب گرم راحت هستی؟"],["Let me wash behind your ears, your armpits, under your chin, and around your neck.","پشت گوش، زیر بغل، زیر چانه و دور گردنت را بشویم."],["Rub your little hands against each other. Rub them hard!","دست‌های کوچک را به هم بمال. محکم بمال!"],["Now tip your head back and I'll wash your hair.","سرت را عقب بده تا موهایت را بشویم."],["Look at the water blasting out of the showerhead!","ببین آب چطور از دوش می‌ریزد!"],["Wash your hair with shampoo and the rest of your body with soap.","مو را با شامپو و بقیه بدن را با صابون بشوی."],["Rinse off with water.","با آب آبکشی کن."],["Okay, let me dry off your hair.","بگذار موهایت را خشک کنم."],["Now you can play with your toys a little longer.","حالا کمی بیشتر با اسباب‌بازی‌ها بازی کن."],["Call me when you want to get out of the bath.","خواستی بیایی بیرون صدایم کن."],["What a mess you've made!","چه ریخت‌وپاشی راه انداختی!"],["The water is getting cold.","آب دارد سرد می‌شود."],["You have to get out of the bath.","باید از حمّام بیایی بیرون."],["After turning the water off, step out of the shower.","آب را ببند و از دوش بیا بیرون."],["Take a towel from the towel rack.","حوله را از جا حوله‌ای بردار."],["Let me wrap a towel around you.","بگذار با حوله بپیچمت."],["Dry you off with a towel.","با حوله خشکت می‌کنم."],["Go get your bathrobe from the closet.","از کمد حوله تنی‌ات را بیاور."],["Dry your hair.","موهایت را خشک کن."]]},{t:"خروج از خانه",p:[["If you don't hurry, we'll be late.","اگر عجله نکنی دیر می‌شود."],["Hurry or you'll be late for school.","زود باش وگرنه به مدرسه دیر می‌رسی."],["You'd better hurry. Your bus is coming.","بهتر است عجله کنی. اتوبوس دارد می‌آید."],["I fear you'll be late.","می‌ترسم دیرت بشود."],["Do you have the time?","ساعت را داری؟"],["It's already 8:00.","ساعت هشت شده."],["I'm late!","دیرم شده!"],["I have to rush!","باید بدوم!"],["Time is running out!","وقت تمام است!"],["We'd better get going!","بهتر است راه بیفتیم!"],["As soon as possible!","هرچه زودتر!"],["Be fast!","زود باش!"],["Now go!","حالا برو!"],["Mom, I'm ready for school.","مامان، برای مدرسه آماده‌ام."],["Don't forget to come straight home after school.","یادت نرود بعد از مدرسه مستقیم بیا خانه."],["I know, mom.","می‌دانم مامان."],["Are you going to be late today?","امروز دیر برمی‌گردی؟"],["No, I'll be home at the usual time.","نه، سر همان ساعت همیشگی."],["What time are you coming home?","ساعت چند برمی‌گردی؟"],["Around seven o'clock.","حدود ساعت هفت."],["Have you got everything?","همه‌چیز را برداشته‌ای؟"],["Aren't you forgetting something?","چیزی جا نمانده؟"],[ const $ = (s,root=document)=>root.querySelector(s);
const els={
  cats:$('#categories'), cards:$('#cards'), search:$('#search'), clear:$('#clearSearch'),
  title:$('#sectionTitle'), count:$('#resultCount'), toast:$('#toast'),
  navHome:$('#navHome'), navFav:$('#navFav'), navSettings:$('#navSettings'),
  settingsTop:$('#settingsTop'), sheet:$('#settingsSheet'), backdrop:$('#backdrop'),
  voiceSelect:$('#voiceSelect'), rate:$('#rate'), rateValue:$('#rateValue'), testVoice:$('#testVoice'),
  installCard:$('#installCard'), installBtn:$('#installBtn')
};

const normalize = s => String(s||'').toLowerCase().normalize('NFKC').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\s+/g,' ').trim();
const escapeHTML = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const totalPhrases=DATA.reduce((n,s)=>n+s.p.length,0);
let state={category:'all',query:'',mode:'home'};
let currentSpeechKey=null;
let currentSpeechButton=null;
let installPrompt=null;
let toastTimer=null;
let voices=[];

const savedFav=(()=>{try{return JSON.parse(localStorage.getItem('kalamat.favorites')||'[]')}catch{return []}})();
const favorites=new Set(Array.isArray(savedFav)?savedFav:[]);
const savedRate=parseFloat(localStorage.getItem('kalamat.rate')||'0.90');
els.rate.value=Number.isFinite(savedRate)?savedRate:0.9;
els.rateValue.textContent=Number(els.rate.value).toFixed(2)+'×';

function iconPlay(){return '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>'}
function iconStop(){return '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1"/></svg>'}
function iconHeart(on){return on?'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.5-9A5.3 5.3 0 0 1 12 7.1 5.3 5.3 0 0 1 21.5 12C19.5 16.4 12 21 12 21Z"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"/></svg>'}
function iconCopy(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="10" height="10" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>'}

function showToast(text){clearTimeout(toastTimer);els.toast.textContent=text;els.toast.classList.add('show');toastTimer=setTimeout(()=>els.toast.classList.remove('show'),1800)}
function saveFav(){localStorage.setItem('kalamat.favorites',JSON.stringify([...favorites]))}

function buildCategories(){
  const items=[{id:'all',title:'همه',count:totalPhrases},...DATA.map((s,i)=>({id:String(i),title:s.t,count:s.p.length}))];
  els.cats.innerHTML=items.map(x=>`<button type="button" class="chip ${state.category===x.id&&state.mode==='home'?'on':''}" data-cat="${x.id}">${escapeHTML(x.title)} <span class="count">${x.count}</span></button>`).join('');
}

function getRows(){
  const q=normalize(state.query); const rows=[];
  DATA.forEach((sec,si)=>sec.p.forEach((pair,pi)=>{
    const key=si+':'+pi;
    if(state.mode==='favorites'&&!favorites.has(key)) return;
    if(state.mode==='home'&&state.category!=='all'&&Number(state.category)!==si) return;
    if(q&&!normalize(pair[0]+' '+pair[1]+' '+sec.t).includes(q)) return;
    rows.push({key,si,pi,cat:sec.t,en:pair[0],fa:pair[1]});
  }));
  return rows;
}

function render(){
  buildCategories();
  const rows=getRows();
  let title='همه جمله‌ها';
  if(state.mode==='favorites') title='علاقه‌مندی‌ها';
  else if(state.category!=='all') title=DATA[Number(state.category)]?.t||'جمله‌ها';
  if(state.query) title='نتایج جست‌وجو';
  els.title.textContent=title; els.count.textContent=rows.length.toLocaleString('fa-IR')+' جمله';
  els.clear.classList.toggle('show',!!state.query);
  els.navHome.classList.toggle('on',state.mode==='home');els.navFav.classList.toggle('on',state.mode==='favorites');els.navSettings.classList.remove('on');
  if(!rows.length){els.cards.innerHTML=`<div class="empty"><strong>${state.mode==='favorites'?'هنوز جمله‌ای ذخیره نکرده‌اید':'نتیجه‌ای پیدا نشد'}</strong><span>${state.mode==='favorites'?'روی علامت قلب کنار هر جمله بزنید.':'کلمه دیگری را جست‌وجو کنید یا دسته‌بندی را تغییر دهید.'}</span></div>`;return}
  let lastSection=-1,html='';
  rows.forEach(r=>{
    const fav=favorites.has(r.key);
    if(state.category==='all'&&state.mode==='home'&&!state.query&&lastSection!==r.si){lastSection=r.si;html+=`<div style="grid-column:1/-1;padding:6px 3px 0;font-weight:900;color:#4b4262">${escapeHTML(r.cat)}</div>`}
    html+=`<article class="card" data-key="${r.key}"><div class="card-main"><div class="phrase"><div class="en">${escapeHTML(r.en)}</div><div class="fa">${escapeHTML(r.fa)}</div></div><div class="card-actions"><button type="button" class="play-btn" data-action="speak" aria-label="پخش تلفظ انگلیسی" title="پخش تلفظ">${iconPlay()}</button><button type="button" class="mini-btn fav ${fav?'on':''}" data-action="favorite" aria-label="افزودن به علاقه‌مندی‌ها" title="علاقه‌مندی">${iconHeart(fav)}</button><button type="button" class="mini-btn" data-action="copy" aria-label="کپی جمله" title="کپی">${iconCopy()}</button></div></div></article>`;
  });
  els.cards.innerHTML=html;
}

function loadVoices(){
  if(!('speechSynthesis' in window)) return;
  voices=window.speechSynthesis.getVoices()||[];
  const english=voices.filter(v=>/^en([_-]|$)/i.test(v.lang||''));
  const pool=english.length?english:voices;
  const saved=localStorage.getItem('kalamat.voice');
  els.voiceSelect.innerHTML=pool.length?pool.map((v,i)=>`<option value="${escapeHTML(v.name)}" ${saved===v.name?'selected':''}>${escapeHTML(v.name)}${v.lang?' — '+escapeHTML(v.lang):''}</option>`).join(''):'<option value="">صدای پیش‌فرض دستگاه</option>';
}
function chosenVoice(){const name=els.voiceSelect.value||localStorage.getItem('kalamat.voice');return voices.find(v=>v.name===name)||voices.find(v=>/^en-US/i.test(v.lang||''))||voices.find(v=>/^en/i.test(v.lang||''))||null}
function resetSpeaking(){
  document.querySelectorAll('.card.speaking').forEach(c=>c.classList.remove('speaking'));
  if(currentSpeechButton){currentSpeechButton.classList.remove('on');currentSpeechButton.innerHTML=iconPlay()}
  currentSpeechKey=null;currentSpeechButton=null;
}
function speak(text,key,btn){
  if(!('speechSynthesis' in window)){showToast('پخش صدا در این مرورگر پشتیبانی نمی‌شود.');return}
  if(currentSpeechKey===key&&window.speechSynthesis.speaking){window.speechSynthesis.cancel();resetSpeaking();return}
  window.speechSynthesis.cancel();resetSpeaking();
  const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=Number(els.rate.value)||0.9;u.pitch=1;
  const v=chosenVoice();if(v)u.voice=v;
  currentSpeechKey=key;currentSpeechButton=btn;
  u.onstart=()=>{btn.classList.add('on');btn.innerHTML=iconStop();btn.closest('.card')?.classList.add('speaking')};
  u.onend=resetSpeaking;u.onerror=e=>{resetSpeaking();if(e.error!=='canceled'&&e.error!=='interrupted')showToast('صدا اجرا نشد. یک صدای انگلیسی دیگر را امتحان کنید.')};
  window.speechSynthesis.speak(u);
}

els.cats.addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;state.mode='home';state.category=b.dataset.cat;render();window.scrollTo({top:0,behavior:'smooth'})});
els.cards.addEventListener('click',async e=>{
  const b=e.target.closest('[data-action]');if(!b)return;const card=b.closest('.card');const key=card?.dataset.key;if(!key)return;
  const [si,pi]=key.split(':').map(Number),pair=DATA[si].p[pi];
  if(b.dataset.action==='speak') speak(pair[0],key,b);
  if(b.dataset.action==='favorite'){favorites.has(key)?favorites.delete(key):favorites.add(key);saveFav();if(state.mode==='favorites')render();else{const on=favorites.has(key);b.classList.toggle('on',on);b.innerHTML=iconHeart(on);showToast(on?'به علاقه‌مندی‌ها اضافه شد':'از علاقه‌مندی‌ها حذف شد')}}
  if(b.dataset.action==='copy'){const text=pair[0]+'\n'+pair[1];try{await navigator.clipboard.writeText(text);b.classList.add('copied');showToast('جمله کپی شد');setTimeout(()=>b.classList.remove('copied'),900)}catch{showToast('کپی خودکار در این مرورگر در دسترس نیست')}}
});
els.search.addEventListener('input',()=>{state.query=els.search.value;render()});
els.clear.addEventListener('click',()=>{els.search.value='';state.query='';render();els.search.focus()});
els.navHome.addEventListener('click',()=>{state.mode='home';render();window.scrollTo({top:0,behavior:'smooth'})});
els.navFav.addEventListener('click',()=>{state.mode='favorites';state.query='';els.search.value='';render();window.scrollTo({top:0,behavior:'smooth'})});
function openSettings(){els.sheet.classList.add('show');els.backdrop.classList.add('show');els.navSettings.classList.add('on');setTimeout(()=>els.voiceSelect.focus({preventScroll:true}),100)}
function closeSettings(){els.sheet.classList.remove('show');els.backdrop.classList.remove('show');els.navSettings.classList.remove('on')}
els.navSettings.addEventListener('click',openSettings);els.settingsTop.addEventListener('click',openSettings);els.backdrop.addEventListener('click',closeSettings);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSettings()});
els.rate.addEventListener('input',()=>{els.rateValue.textContent=Number(els.rate.value).toFixed(2)+'×';localStorage.setItem('kalamat.rate',els.rate.value)});
els.voiceSelect.addEventListener('change',()=>localStorage.setItem('kalamat.voice',els.voiceSelect.value));
els.testVoice.addEventListener('click',()=>speak('Practice makes progress.','__test__',els.testVoice));
if('speechSynthesis' in window){loadVoices();window.speechSynthesis.onvoiceschanged=loadVoices}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&'speechSynthesis' in window){window.speechSynthesis.cancel();resetSpeaking()}});

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;els.installCard.classList.add('show')});
els.installBtn.addEventListener('click',async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;els.installCard.classList.remove('show')});
window.addEventListener('appinstalled',()=>{els.installCard.classList.remove('show');showToast('برنامه روی گوشی نصب شد')});

render();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('service-worker.js');
  });
}
</script>
</body>
</html>
